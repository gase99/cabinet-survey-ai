[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["app/geometry"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
exclude = ["^app/geometry/"]

[[tool.mypy.overrides]]
module = ["app.geometry.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["svglib.*", "arabic_reshaper.*", "bidi.*"]
ignore_missing_imports = true
