# TLS is terminated by the owner's reverse proxy on the host. No static web client.
server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /api/v1/telegram/internal/ { return 404; }
    location = /api/v1/telegram/verify-pairing { return 404; }
    location = /api/v1/telegram/webhook { return 404; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Append the peer (the owner's TLS proxy). The API trusts this header only from
        # addresses in FORWARDED_ALLOW_IPS (default 127.0.0.1 = not trusted); see operations.md.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location = /ready { proxy_pass http://api:8000/ready; }
    location = /telegram/webhook {
        proxy_pass http://telegram:8081/webhook;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
