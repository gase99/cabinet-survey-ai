# TLS is terminated by the owner's reverse proxy on the host. No static web client.
server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /api/v1/telegram/internal/ { return 404; }
    location = /api/v1/telegram/verify-pairing { return 404; }
    location = /api/v1/telegram/webhook { return 404; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 100s;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location = /telegram/webhook {
        proxy_pass http://telegram:8081/webhook;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
