# docker compose --env-file .env -f deploy/compose.yml up --build -d
# Android APK is installed separately. This stack serves API + bot, NOT a web app.
name: cabinet-survey
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cabinet_survey
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cabinet -d cabinet_survey']
      interval: 5s
      retries: 10
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://cabinet:${POSTGRES_PASSWORD}@db:5432/cabinet_survey
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      TELEGRAM_WORKER_SECRET: ${TELEGRAM_WORKER_SECRET:?Set API-worker secret}
      EXPORT_STORAGE_DIR: /data/exports
      ASSET_STORAGE_DIR: /data/assets
    volumes: [exports:/data/exports, assets:/data/assets]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  telegram:
    build: ../services/telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set bot token}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set independent ingress secret}
      BACKEND_WORKER_SECRET: ${TELEGRAM_WORKER_SECRET:?Set shared API-worker secret}
      BACKEND_URL: http://api:8000/api/v1/
      EXPORT_STORAGE_DIR: /data/exports
      WORKER_DATABASE: /data/worker/worker.sqlite
    volumes: [exports:/data/exports:ro, worker:/data/worker]
    depends_on:
      api: {condition: service_healthy}
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes: ['./gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api: {condition: service_healthy}
      telegram: {condition: service_healthy}
volumes:
  postgres:
  exports:
  assets:
  worker:
