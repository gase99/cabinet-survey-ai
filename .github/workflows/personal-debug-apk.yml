name: personal-debug-apk
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Debug API base URL (HTTP only works for Android debug allowlisted hosts)'
        required: true
        default: 'http://127.0.0.1:8000/api/v1/'
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: git rev-parse HEAD
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.7', cache: true}
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - name: Validate with the app's validateApiBase
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: flutter test test/dispatch_api_url_test.dart --dart-define=DISPATCH_VALIDATE=true --dart-define="DISPATCH_API_URL=$API_URL"
        working-directory: apps/client
      - name: Build debug APK
        env:
          API_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --debug --dart-define="API_BASE_URL=$API_URL"
        working-directory: apps/client
      - uses: actions/upload-artifact@v4
        with:
          name: personal-debug-apk
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
