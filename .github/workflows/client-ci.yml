name: android-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: git rev-parse HEAD
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.7', cache: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Python regression and Android-only configuration gates
        run: |
          pip install -r backend/requirements.txt
          python -m pytest tests -q
          cd backend && python -m pytest -q
      - name: Resolve Android dependencies (platform sources are committed)
        run: flutter pub get
        working-directory: apps/client
      - run: flutter analyze --no-fatal-infos
        working-directory: apps/client
      - run: flutter test --reporter expanded --timeout 30s
        working-directory: apps/client
      - name: Native Dart real HTTP/SQLite workflow, not a device claim
        run: python ../../scripts/run-client-acceptance.py --native
        working-directory: apps/client
      - name: Android native validation and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
        working-directory: apps/client/android
      - name: Build installable debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1/
        working-directory: apps/client
      - name: Compile release AAB with disposable CI signing: NOT for publication
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-only.jks" -storepass ci-only-password \
            -keypass ci-only-password -alias ci-only -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Disposable CI Build, O=Cabinet Survey, C=US"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ci-only.jks"
          export ANDROID_KEYSTORE_PASSWORD=ci-only-password ANDROID_KEY_PASSWORD=ci-only-password ANDROID_KEY_ALIAS=ci-only
          flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.invalid/api/v1/
          rm -f "$RUNNER_TEMP/ci-only.jks"
        working-directory: apps/client
      - name: Record artifact limitations
        run: |
          mkdir -p /tmp/android-artifacts
          git rev-parse HEAD > /tmp/android-artifacts/commit.txt
          printf '%s\n' 'CI compilation only; disposable signing; .invalid API host.' \
            'Not an owner-signed or connected production release.' \
            'Rebuild with scripts/build-android.sh release and private owner signing.' > /tmp/android-artifacts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-builds-not-for-publication
          path: |
            /tmp/android-artifacts/
            apps/client/build/app/outputs/flutter-apk/app-debug.apk
            apps/client/build/app/outputs/bundle/release/app-release.aab
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.7', cache: true}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: apps/client
      - name: Real Android emulator capture and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/client
          script: bash ../../scripts/android-emulator-smoke.sh
