name: android-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: git rev-parse HEAD
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.7', cache: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Python regression and Android-only configuration gates
        run: |
          pip install -r backend/requirements.lock -r backend/requirements-dev.lock
          python -m pytest tests -q
          cd backend && python -m pytest -q
      - name: Resolve Android dependencies from locked pubspec.lock
        run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter analyze --no-fatal-infos
        working-directory: apps/client
      - name: Run flutter test
        run: |
          set -o pipefail
          flutter test --reporter expanded --timeout 30s 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
        working-directory: apps/client
      - name: Preserve flutter test diagnostics on GitHub API
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'flutter-test.log'
          if p.exists():
              detail=p.read_text(errors='replace')[-24000:]
              for offset in range(0,len(detail),3000):
                  chunk=detail[offset:offset+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error::'+chunk)
          PY
      - name: Native Dart real HTTP/SQLite workflow, not a device claim
        run: python ../../scripts/run-client-acceptance.py --native
        working-directory: apps/client
      - name: Android native validation and lint
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/android-native.log"
        working-directory: apps/client/android
      - name: Preserve native diagnostics on GitHub API (log download may be unavailable)
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'android-native.log'
          text=p.read_text(errors='replace') if p.exists() else 'Native gate failed before Gradle logging'
          lines=[line for line in text.splitlines() if any(word in line.lower() for word in ['error','failed','failure','exception','caused by','what went wrong','e: '])]
          detail='\n'.join(lines)[-24000:]
          print(detail)
          for offset in range(0,len(detail),3000):
              chunk=detail[offset:offset+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error::'+chunk)
          PY
      - name: Build installable debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1/
        working-directory: apps/client
      - name: Build release AAB (owner CI secrets when configured; disposable CI keystore fallback)
        env:
          CI_ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref_protected == true) || startsWith(github.ref, 'refs/tags/')) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          CI_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref_protected == true) || startsWith(github.ref, 'refs/tags/')) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref_protected == true) || startsWith(github.ref, 'refs/tags/')) && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref_protected == true) || startsWith(github.ref, 'refs/tags/')) && secrets.ANDROID_KEY_PASSWORD || '' }}
          CI_RELEASE_API_BASE_URL: ${{ github.event_name == 'push' && ((startsWith(github.ref, 'refs/heads/') && github.ref_protected == true) || startsWith(github.ref, 'refs/tags/')) && secrets.RELEASE_API_BASE_URL || '' }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release-signing.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          if [[ -n "${CI_ANDROID_KEYSTORE_BASE64:-}" && -n "${CI_ANDROID_KEYSTORE_PASSWORD:-}" && -n "${CI_ANDROID_KEY_ALIAS:-}" && -n "${CI_ANDROID_KEY_PASSWORD:-}" ]]; then
            KEYSTORE_FILE="$KEYSTORE_FILE" python3 -c "import base64, os, pathlib; pathlib.Path(os.environ['KEYSTORE_FILE']).write_bytes(base64.b64decode(os.environ['CI_ANDROID_KEYSTORE_BASE64']))"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PASSWORD="$CI_ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$CI_ANDROID_KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$CI_ANDROID_KEY_PASSWORD"
            SIGNING_MODE="owner-secrets"
          else
            keytool -genkeypair -keystore "$KEYSTORE_FILE" -storepass ci-only-password \
              -keypass ci-only-password -alias ci-only -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=Disposable CI Build, O=Cabinet Survey, C=US"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PASSWORD=ci-only-password
            export ANDROID_KEY_ALIAS=ci-only
            export ANDROID_KEY_PASSWORD=ci-only-password
            SIGNING_MODE="disposable-ci"
          fi
          echo "SIGNING_MODE=$SIGNING_MODE" > "$RUNNER_TEMP/signing-mode.txt"
          API_URL="${CI_RELEASE_API_BASE_URL:-https://api.example.invalid/api/v1/}"
          flutter build appbundle --release --dart-define="API_BASE_URL=$API_URL" 2>&1 | tee "$RUNNER_TEMP/android-release.log"
        working-directory: apps/client
      - name: Preserve release diagnostics through GitHub API
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          text=(root/'android-release.log').read_text(errors='replace') if (root/'android-release.log').exists() else 'Release gate failed before logging'
          detail=text[-27000:]
          print(detail)
          for offset in range(0,len(detail),3000):
              chunk=detail[offset:offset+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error::'+chunk)
          PY
      - name: Record artifact provenance and signing mode
        run: |
          mkdir -p /tmp/android-artifacts
          git rev-parse HEAD > /tmp/android-artifacts/commit.txt
          cp "$RUNNER_TEMP/signing-mode.txt" /tmp/android-artifacts/signing-mode.txt
          printf '%s\n' 'Debug APK + Release AAB built in CI.' \
            'Check signing-mode.txt: owner secrets are available only on protected-branch or tag pushes; other events use disposable signing and an .invalid API host.' \
            'For local owner release builds, use scripts/build-android.sh release with private signing.' > /tmp/android-artifacts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-builds
          path: |
            /tmp/android-artifacts/
            apps/client/build/app/outputs/flutter-apk/app-debug.apk
            apps/client/build/app/outputs/bundle/release/app-release.aab
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.7', cache: true}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - name: Real Android emulator capture and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/client
          script: set -o pipefail; bash ../../scripts/android-emulator-smoke.sh 2>&1 | tee "$RUNNER_TEMP/emulator-test.log"
      - name: Preserve emulator diagnostics on GitHub API
        if: failure()
        run: |
          python3 - <<'PYLOG'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'emulator-test.log'
          text = path.read_text(errors='replace')[-27000:] if path.exists() else 'Emulator failed before test logging'
          for offset in range(0, len(text), 3000):
              chunk = text[offset:offset+3000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error::' + chunk)
          PYLOG
