name: backend-ci
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install locked backend and static-analysis dependencies
        run: pip install -r backend/requirements.lock -r backend/requirements-dev.lock
      - name: Ruff lint gate (backend excluding frozen geometry)
        run: ruff check app migrations tests
        working-directory: backend
      - name: Mypy type-check gate (backend excluding frozen geometry)
        run: mypy app migrations tests
        working-directory: backend
      - name: Repository structural and governance gates
        run: pytest tests -q
      - name: Backend unit and integration tests
        run: pytest -q --junitxml=/tmp/backend-tests.xml
        working-directory: backend
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cabinet_test
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: ci-only-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d cabinet_test"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fixture:ci-only-fixture@localhost:5432/cabinet_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r requirements.lock
        working-directory: backend
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        working-directory: backend

      - name: PostgreSQL transaction and concurrency regressions
        env:
          ACCEPTANCE_DISPOSABLE_DATABASE: '1'
        run: |
          set -o pipefail
          pytest tests/test_postgres_concurrency.py -vv 2>&1 | tee "$RUNNER_TEMP/pg-concurrency.log"
        working-directory: backend
      - name: Preserve PostgreSQL diagnostics on GitHub API
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'pg-concurrency.log'
          if p.exists():
              detail = p.read_text(errors='replace')[-24000:]
              for offset in range(0, len(detail), 3000):
                  chunk = detail[offset:offset+3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + chunk)
          PY
      - name: Disposable PostgreSQL and asset backup restoration drill
        env:
          ACCEPTANCE_DISPOSABLE_DATABASE: '1'
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PYTHONPATH: backend
        run: python scripts/postgres-restore-drill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-recovery-evidence
          path: /tmp/acceptance-restore.json
